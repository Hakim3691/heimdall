# Heimdall Gradle configuration.
# Sized for low-resource CI/dev containers (2 vCPU / 4 GB); raise for workstation builds.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

kotlin.code.style=official
kotlin.incremental=true

# Version stamped into BuildConfig.VERSION_NAME by :app
heimdall.versionName=0.3.3
heimdall.versionCode=8
# NDK release used by :app and :engine:vlm (must match CI).
heimdall.ndkVersion=27.2.12479018
