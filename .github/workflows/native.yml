name: native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned llama.cpp
        run: scripts/fetch-llama.sh

      - name: Assemble debug APK (arm64-v8a)
        run: ./gradlew :app:assembleDebug -Pheimdall.abis=arm64-v8a --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: heimdall-debug-apk
          path: app/build/outputs/apk/debug/*.apk
