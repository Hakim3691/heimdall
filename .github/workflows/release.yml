name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Secrets cannot be read from `if:` expressions, so they are lifted into the job env and
    # the keystore steps test those env vars instead.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned llama.cpp
        run: scripts/fetch-llama.sh

      # Optional: restore a real release keystore. Without it the build falls back to the
      # debug key, so a release APK (and its update identity) always exists.
      - name: Restore keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > keystore.properties

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease -Pheimdall.abis=arm64-v8a --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug -Pheimdall.abis=arm64-v8a --console=plain

      - name: Publish GitHub release
        # workflow_dispatch on a branch is a build-only smoke test; only a v* tag publishes.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          body: |
            Heimdall ${{ github.ref_name }} — on-device screen co-pilot (Android 12+).

            * Release APK: `app-release.apk` (arm64-v8a)
            * Debug APK: `app-debug.apk` (arm64-v8a, applicationId `com.heimdall.debug`)

            No network permission is requested by either build. Model weights are not bundled;
            see README for the MiniCPM-V 2.6 GGUF files.
