name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned llama.cpp
        run: scripts/fetch-llama.sh

      # Optional: restore a real release keystore. Without it the build falls back to the
      # debug key, so a release APK (and its update identity) always exists.
      - name: Restore keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks

      - name: Write keystore.properties
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          {
            echo "storeFile=release-keystore.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > keystore.properties

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease -Pheimdall.abis=arm64-v8a --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug -Pheimdall.abis=arm64-v8a --console=plain

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          body: |
            Heimdall ${{ github.ref_name }} — on-device screen co-pilot (Android 12+).

            * Release APK: `app-release.apk` (arm64-v8a)
            * Debug APK: `app-debug.apk` (arm64-v8a, applicationId `com.heimdall.debug`)

            No network permission is requested by either build. Model weights are not bundled;
            see README for the MiniCPM-V 2.6 GGUF files.
